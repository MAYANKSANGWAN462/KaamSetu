<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&amp;display=swap');</style>
  </defs>
  <!-- Full-bleed cream background (no rounded corners — OS applies its own mask) -->
  <rect width="512" height="512" fill="#FBF6EF"/>
  <!-- Content in safe zone: 10–90% of 512 = x:52–460, y:52–460 -->
  <!-- KaamSetu wordmark centred vertically in safe zone -->
  <text x="52" y="306"
        font-family="'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif"
        font-weight="800" font-size="112"
        textLength="408" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#2B2119">Kaam</tspan><tspan fill="#E9731A">Setu</tspan>
  </text>
  <!-- Bridge arch spanning the text width inside safe zone -->
  <path d="M 52 364 C 168 328,344 328,460 364"
        fill="none" stroke="#E9731A" stroke-width="16" stroke-linecap="round"/>
</svg>
