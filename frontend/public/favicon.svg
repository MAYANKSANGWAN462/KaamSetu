<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&amp;display=swap');</style>
  </defs>
  <!-- Cream background, rounded corners -->
  <rect width="100" height="100" rx="22" fill="#FBF6EF"/>
  <!-- KaamSetu wordmark, stretched to fill width -->
  <text x="5" y="58"
        font-family="'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif"
        font-weight="800" font-size="24"
        textLength="90" lengthAdjust="spacingAndGlyphs">
    <tspan fill="#2B2119">Kaam</tspan><tspan fill="#E9731A">Setu</tspan>
  </text>
  <!-- Bridge arch -->
  <path d="M 5 70 C 30 62,70 62,95 70"
        fill="none" stroke="#E9731A" stroke-width="3.5" stroke-linecap="round"/>
</svg>
